apiVersion: v1
kind: ServiceAccount
metadata:
  name: openchoreo-gitops
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openchoreo-gitops
  namespace: default
rules:
  - apiGroups:
      - openchoreo.dev
    resources:
      - componentreleases
      - deploymentpipelines
      - projects
      - releasebindings
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openchoreo-gitops
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openchoreo-gitops
subjects:
  - kind: ServiceAccount
    name: openchoreo-gitops
    namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openchoreo-gitops-bootstrap
  namespace: flux-system
rules:
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - gitrepositories
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openchoreo-gitops-bootstrap
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openchoreo-gitops-bootstrap
subjects:
  - kind: ServiceAccount
    name: openchoreo-gitops
    namespace: flux-system
